name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  testthat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      # Solo las cinco que los tests necesitan de verdad. El proyecto completo
      # depende ademas de fable, feasts, forecast, rugarch y ggtime, pero esas
      # entran en el pipeline de modelado -- no en tests/testthat/, que cubre
      # la generacion de datos sinteticos y el wrangling. Instalarlas igual
      # agregaria varios minutos por corrida sin verificar una linea mas.
      #
      # use-public-rspm sirve binarios precompilados para Ubuntu, que es la
      # diferencia entre un job de un minuto y uno de quince compilando desde
      # fuente.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::dplyr
            any::lubridate
            any::tibble
            any::tsibble

      # Verificado localmente: con un test fallando, tests/testthat.R sale con
      # codigo 1, asi que un job verde si significa que las aserciones pasaron.
      - name: Run testthat suite
        run: Rscript tests/testthat.R

      # Lo que el codigo de salida NO distingue es "todo paso" de "no se
      # descubrio ningun test" -- un archivo renombrado o un patron de busqueda
      # roto dejarian el badge verde sin verificar nada. Esto cuenta los
      # resultados y falla si son cero.
      - name: Assert the suite actually ran
        run: |
          Rscript -e '
            res <- testthat::test_dir("tests/testthat", reporter = "silent", stop_on_failure = FALSE)
            df <- as.data.frame(res)
            total <- sum(df$nb)
            cat("Aserciones ejecutadas:", total, "en", nrow(df), "bloques test_that\n")
            if (total < 1) {
              cat("::error::testthat no descubrio ninguna asercion\n")
              quit(status = 1)
            }
          '
